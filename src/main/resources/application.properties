spring.application.name=tarea-IP03

# Configuración del servidor
server.port=${PORT:8080}

# En Docker, el archivo compose.yaml sobrescribe estos valores
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bodega_don_pepe}?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración a JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de las fechas created_at | updated_at
spring.jackson.time-zone=America/Lima

# Desactivar advertencia open-in-view
spring.jpa.open-in-view=false

# Configurar Swagger / OpenApi
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
